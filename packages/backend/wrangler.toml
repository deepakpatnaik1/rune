name = "rune-backend"
main = "src/index.ts"
compatibility_date = "2024-01-15"

[dev]
port = 8787

# Environment variables loaded from .env automatically by wrangler
# OPENAI_API_KEY will be available in development from .env file

[env.development]
name = "rune-backend-dev"

[env.production]
name = "rune-backend-prod"

# Uncomment and configure when you set up R2
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "your-bucket-name"